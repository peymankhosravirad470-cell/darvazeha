<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120c06" />
<title>آرگاد — تالار شطرنج | VIVA</title>
<link rel="icon" href="data:," />
<script src="https://tapi.bale.ai/miniapp.js"></script>
<link rel="stylesheet" href="../assets/hall-theme.css" />
<style>
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

/* ---------- اختصاصی آرگاد: صفحهٔ بازی ---------- */
.board-zone {
  position: relative;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(96,66,24,0.32) 0%, transparent 55%),
    linear-gradient(180deg, rgba(46,34,18,0.94), rgba(22,15,8,0.96));
  border: 1px solid rgba(226,178,84,0.55); border-radius: 18px; padding: 14px; margin-bottom: 12px;
  box-shadow: 0 18px 42px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,228,160,0.16);
}
.names { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
.names .pl { display: flex; align-items: center; gap: 7px; }
.names .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #666; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
.names .dot.w { background: radial-gradient(circle at 35% 30%, #fffbe8, #d8c8a0); border-color: #a89060; }
.names .dot.b { background: radial-gradient(circle at 35% 30%, #5a4630, #171008); border-color: #d9a93c; }
.names .turn { font-size: 10.5px; color: #ffd98a; border: 1px solid rgba(226,178,84,0.5); border-radius: 999px; padding: 4px 10px;
  background: linear-gradient(180deg, rgba(90,64,26,0.4), rgba(40,28,12,0.5)); }
.clockrow { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; color: #ffe9a8;
  font-variant-numeric: tabular-nums; margin-bottom: 8px; }
/* بوم شطرنج Phaser — قاب چوبی و مهره‌ها داخل بوم رندر می‌شوند */
.board { width: 100%; aspect-ratio: 1; direction: ltr; user-select: none; touch-action: manipulation;
  border-radius: 12px; }
.history { margin-top: 9px; font-size: 11px; color: #b8ab8a; direction: ltr; text-align: left; max-height: 52px; overflow-y: auto; }
.btnrow { display: flex; gap: 8px; margin-top: 10px; }
.btnrow .big-btn { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="/viva/" aria-label="بازگشت">›</a>
    <div class="tb-title"><b>تالار آرگاد</b><span>ARGAD · CHESS HALL</span></div>
    <button class="sound" id="sound" aria-label="صدا">🔇</button>
    <div class="net" id="net"><span class="d"></span><span id="net-t">…</span></div>
  </header>

  <!-- صحنهٔ سینمایی تالار: بوم Phaser (تالار اشرافی، پنجرهٔ قوسی، فرش، شمعدان) -->
  <section class="hall-stage" aria-label="صحنهٔ تالار آرگاد">
    <div id="hall-canvas" style="position:absolute;inset:0"></div>
    <div class="frame-glow"></div>
  </section>

  <!-- لابی -->
  <section id="lobby">
    <div class="panel">
      <div class="phase-row"><span class="phase-badge">لابی تالار</span></div>
      <div class="phase-msg">شطرنج دو نفره با قوانین کامل سرور: کیش، مات، پات، تساوی، آن‌پاسان، قلعه و ارتقا.
      یک ساعت انتخاب کن و اتاق بساز؛ حریف دوم می‌پیوندد.</div>
      <div id="my-room" class="hidden">
        <div class="phase-msg" id="my-room-info"></div>
        <button class="big-btn gold" id="start-btn">آغاز مسابقه</button>
        <button class="big-btn danger" id="leave-btn">خروج از اتاق</button>
      </div>
      <div id="room-make">
        <div class="pill-row" id="clock-pills"></div>
        <button class="big-btn" id="make-btn">ساخت میز بازی</button>
      </div>
      <div class="rooms-list" id="rooms-list"></div>
    </div>
  </section>

  <!-- مسابقه -->
  <section id="match" class="hidden">
    <div class="board-zone">
      <div class="names">
        <span class="pl"><span class="dot" id="dot-top"></span><b id="name-top">—</b><span class="clock" id="clock-top"></span></span>
        <span class="turn" id="turn-badge">…</span>
      </div>
      <div class="board" id="board"></div>
      <div class="names" style="margin-top:8px">
        <span class="pl"><span class="dot" id="dot-bottom"></span><b id="name-bottom">—</b><span class="clock" id="clock-bottom"></span></span>
        <span style="font-size:10.5px;color:#b3a67f" id="check-badge"></span>
      </div>
      <div class="history" id="history"></div>
    </div>
    <div class="panel">
      <div class="phase-msg" id="phase-msg">…</div>
      <div class="btnrow">
        <button class="big-btn danger" id="resign-btn">استعفا</button>
        <button class="big-btn gold" id="draw-btn">پیشنهاد تساوی</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay hidden" id="result-overlay">
  <div class="card">
    <div style="font-size:34px">♛</div>
    <h2 id="res-title">—</h2>
    <div class="phase-msg" id="res-sub"></div>
    <div class="rw" id="res-rw"></div>
    <button class="back-btn" id="res-back">بازگشت به تالار</button>
  </div>
</div>

<script src="../vendor/howler.min.js"></script>
<script src="../vendor/phaser.min.js"></script>
<script src="../assets/viva-halls.js"></script>
<script src="../live.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var myId = null, serverOffset = 0;
  var lastState = null, match = null;
  var selected = null;         // خانهٔ انتخاب‌شده "e2"
  var legalByFrom = {};        // e2 → ["e3","e4",...]
  var lastMoveUci = null;
  var myRoomId = null;

  // صحنهٔ سینمایی تالار
  var hallGame = VivaHalls.bootRoom($("hall-canvas"), "argad");
  // صفحهٔ شطرنج Phaser — با موقعیت آغازین استاندارد
  var boardApi = VivaHalls.createBoard($("board"), { onSquare: function (sq) { onSquare(sq); } });
  boardApi.update({
    fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
    selected: null, legal: [], legalCapture: [],
    lastFrom: null, lastTo: null, checkSq: null, myColor: "white"
  });

  var CLOCK_OPTS = [
    { label: "بدون ساعت", initial: 0, inc: 0 },
    { label: "۵ + ۰", initial: 300, inc: 0 },
    { label: "۱۰ + ۰", initial: 600, inc: 0 }
  ], clockSel = 1;

  function now() { return Date.now() / 1000 + serverOffset; }
  function toast(text) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }

  // --- صدا: پرنده‌های صبحگاهی (Howler) ---
  var AMBIENT_MIX = { sporadic: [{ src: "../assets/audio/birds.mp3", vol: 0.20, minMs: 7000, maxMs: 17000 }] };
  function toggleSound() {
    var on = VivaAudio.toggle(AMBIENT_MIX);
    $("sound").textContent = on ? "🔊" : "🔇";
  }

  Viva.on("status", function (s) {
    var n = $("net");
    n.className = "net " + (s === "online" ? "on" : s === "offline" ? "off" : "");
    $("net-t").textContent = s === "online" ? "متصل" : s === "offline" ? "قطع" : "…";
  });
  Viva.on("state", function (st) { lastState = st; renderState(st); });
  Viva.on("event", function (ev) {
    if (!ev || !ev.type) return;
    switch (ev.type) {
      case "move":
        lastMoveUci = ev.uci;
        if (ev.check) toast("کیش!");
        if (lastState) renderBoard(lastState);
        Viva.refresh(); // حرکات مجاز و ساعت باید تازه شود
        break;
      case "match_start":
        toast("مسابقه آغاز شد!");
        Viva.refresh();
        break;
      case "draw_offer":
        if (confirm("حریف پیشنهاد تساوی داده. می‌پذیری؟")) Viva.action({ type: "accept_draw" });
        break;
      case "match_finished":
        showResult(ev);
        break;
      case "server_error":
        if (ev.msg === "rate_limited") toast("آهسته‌تر!");
        break;
    }
  });

  // --- رندر صفحه ---
  function pieceAt(fen, file, rank) {
    // fen شمارش رنک از ۸ تا ۱
    var rows = fen.split(" ")[0].split("/");
    var row = rows[7 - rank]; // rank 0 = رنک ۱
    var f = 0;
    for (var i = 0; i < row.length; i++) {
      var ch = row[i];
      if (ch >= "1" && ch <= "8") { f += parseInt(ch, 10); continue; }
      if (f === file) return ch;
      f++;
    }
    return null;
  }

  function renderBoard(st) {
    match = st.match || match;
    if (!match) return;
    var fen = match.fen;
    var legal = (match.you && match.you.legal_moves) || [];
    legalByFrom = {};
    legal.forEach(function (u) {
      var from = u.slice(0, 2);
      (legalByFrom[from] = legalByFrom[from] || []).push(u);
    });
    var myTurn = match.you && match.you.color === match.turn && !match.winner;

    // دادهٔ صحنهٔ شطرنج Phaser
    var legalUci = (myTurn && selected && legalByFrom[selected]) ? legalByFrom[selected] : [];
    var legalCapture = legalUci.filter(function (u) {
      var to = u.slice(2, 4);
      return !!pieceAt(fen, "abcdefgh".indexOf(to[0]), parseInt(to[1], 10) - 1);
    }).map(function (u) { return u.slice(2, 4); });
    var movedChar = null;
    if (lastMoveUci) {
      movedChar = pieceAt(fen, "abcdefgh".indexOf(lastMoveUci[2]), parseInt(lastMoveUci[3], 10) - 1);
    }
    boardApi.update({
      fen: fen,
      selected: myTurn ? selected : null,
      legal: legalUci,
      legalCapture: legalCapture,
      lastFrom: lastMoveUci ? lastMoveUci.slice(0, 2) : null,
      lastTo: lastMoveUci ? lastMoveUci.slice(2, 4) : null,
      movedChar: movedChar,
      checkSq: (match.check && !match.winner) ? findKing(fen, match.turn) : null,
      myColor: match.you ? match.you.color : "white"
    });

    // نام‌ها و رنگ‌ها
    var myColor = match.you ? match.you.color : null;
    var topColor = myColor === "white" ? "black" : "white";
    var nameByColor = { white: match.white ? nameOf(match.white) : "سفید", black: match.black ? nameOf(match.black) : "سیاه" };
    $("name-top").textContent = nameByColor[topColor];
    $("name-bottom").textContent = nameByColor[myColor || "white"];
    $("dot-top").className = "dot " + topColor[0];
    $("dot-bottom").className = "dot " + (myColor || "white")[0];
    $("turn-badge").textContent = match.winner ? "پایان" : (match.turn === "white" ? "نوبت سفید" : "نوبت سیاه");
    $("check-badge").textContent = match.check && !match.winner ? "⚠️ کیش!" : "";
    // ساعت
    renderClocks(match, topColor, myColor);
    // تاریخچه
    var h = $("history");
    h.textContent = (match.history_san || []).map(function (s, i) { return (i % 2 === 0 ? (i / 2 + 1) + ". " : "") + s; }).join("  ");
    h.scrollTop = h.scrollHeight;
    // پیام وضعیت
    var msg = $("phase-msg");
    if (match.winner) msg.textContent = "مسابقه پایان یافت.";
    else if (myTurn) msg.textContent = selected ? "خانهٔ مقصد را بزن." : "نوبت شماست — مهره‌ای را انتخاب کن.";
    else msg.textContent = "نوبت حریف است…";
  }

  function renderClocks(match, topColor, myColor) {
    var c = match.clock;
    if (!c) { $("clock-top").textContent = ""; $("clock-bottom").textContent = ""; return; }
    $("clock-top").textContent = fmt(c[topColor]);
    $("clock-bottom").textContent = fmt(c[myColor || "white"]);
    function fmt(sec) {
      if (sec === undefined || sec === null) return "";
      sec = Math.max(0, sec);
      var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" + s : s);
    }
  }

  function findKing(fen, color) {
    var target = color === "white" ? "K" : "k";
    var rows = fen.split(" ")[0].split("/");
    for (var r = 0; r < 8; r++) {
      var f = 0;
      for (var i = 0; i < rows[r].length; i++) {
        var ch = rows[r][i];
        if (ch >= "1" && ch <= "8") { f += parseInt(ch, 10); continue; }
        if (ch === target) return "abcdefgh"[f] + (8 - r);
        f++;
      }
    }
    return null;
  }

  function onSquare(sqName) {
    if (!match || match.winner) return;
    if (!(match.you && match.you.color === match.turn)) { toast("نوبت شما نیست"); return; }
    var moves = legalByFrom[sqName];
    if (moves) {
      selected = (selected === sqName) ? null : sqName;
    } else if (selected) {
      var uci = null;
      (legalByFrom[selected] || []).forEach(function (u) {
        if (u.slice(2, 4) === sqName) uci = u;
      });
      if (uci) {
        // ارتقا: پیش‌فرض وزیر
        if (uci.length === 4) {
          var pc = pieceAt(match.fen, "abcdefgh".indexOf(selected[0]), parseInt(selected[1], 10) - 1);
          if (pc && pc.toLowerCase() === "p" && (sqName[1] === "8" || sqName[1] === "1")) uci += "q";
        }
        Viva.action({ type: "move", move: uci });
        selected = null;
      } else {
        selected = null;
      }
    } else {
      selected = null;
    }
    if (lastState) renderBoard(lastState);
  }

  function nameOf(accountId) {
    if (!lastState) return accountId;
    for (var i = 0; i < lastState.players.length; i++)
      if (lastState.players[i].account_id === accountId) return lastState.players[i].display_name;
    return accountId.slice(0, 6);
  }

  function renderState(st) {
    if (!st) return;
    if (st.status === "lobby" || st.status === "closed") {
      $("match").classList.add("hidden");
      $("lobby").classList.remove("hidden");
      var mine = st.players.some(function (p) { return p.account_id === myId; });
      if (mine) {
        $("my-room").classList.remove("hidden");
        $("room-make").classList.add("hidden");
        $("my-room-info").textContent = "میز شما: " + st.players.length + "/2 — " +
          st.players.map(function (p) { return p.display_name; }).join(" در برابر ");
        $("start-btn").disabled = st.host !== myId || st.players.length < 2;
        $("start-btn").textContent = st.host !== myId ? "انتظار برای میزبان…" :
          st.players.length < 2 ? "در انتظار حریف دوم…" : "آغاز مسابقه";
      } else {
        $("my-room").classList.add("hidden");
        $("room-make").classList.remove("hidden");
      }
    } else {
      $("lobby").classList.add("hidden");
      $("match").classList.remove("hidden");
      renderBoard(st);
      boardApi.refresh(); // بوم پس از نمایان‌شدن باید اندازه بگیرد
    }
  }

  function showResult(ev) {
    var r = ev.result || {};
    var titles = { checkmate: "کیش و مات!", resignation: "استعفا", timeout: "اتمام وقت", forfeit_disconnect: "قطع اتصال حریف",
      forfeit_leave: "خروج حریف", stalemate: "پات — مساوی", threefold_repetition: "تکرار سه‌باره — مساوی",
      fifty_move: "قاعدهٔ ۵۰ حرکت — مساوی", insufficient_material: "قدرت‌ناقص — مساوی", agreement: "تساوی با توافق" };
    var title;
    if (r.winner === "draw") title = "مساوی 🤝";
    else title = (r.winner === "white" ? "سفید برد! ♔" : "سیاه برد! ♚") + " — " + (titles[r.reason] || "");
    $("res-title").textContent = title;
    $("res-sub").textContent = "دلیل: " + (titles[r.reason] || r.reason || "—");
    var rw = r.rewards || {};
    $("res-rw").textContent = myId && rw[myId] !== undefined ? "پاداش شما: " + rw[myId] + " توکن VIVA" : "";
    $("result-overlay").classList.remove("hidden");
  }

  // --- لابی ---
  function renderClockPills() {
    var box = $("clock-pills"); box.innerHTML = "";
    CLOCK_OPTS.forEach(function (o, i) {
      var b = document.createElement("button");
      b.className = "pill" + (i === clockSel ? " sel" : "");
      b.textContent = o.label;
      b.addEventListener("click", function () { clockSel = i; renderClockPills(); });
      box.appendChild(b);
    });
  }
  function refreshRooms() {
    if (lastState && (lastState.status === "playing" || lastState.status === "finished")) return;
    Viva.rooms.list("chess").then(function (d) {
      var box = $("rooms-list"); box.innerHTML = "";
      if (!d.rooms.length) { box.innerHTML = '<div class="room-card">هنوز میزی نیست — اولین میز را بساز!</div>'; return; }
      d.rooms.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "room-card";
        el.innerHTML = "<span>♛ <b>" + r.host_name + "</b> · " + r.seated + "/" + r.capacity +
          (r.status === "playing" ? " · در جریان" : "") + "</span>";
        var btn = document.createElement("button");
        btn.className = "join"; btn.textContent = r.status === "lobby" ? "پیوستن" : "تماشا";
        btn.addEventListener("click", function () { joinRoom(r.room_id); });
        el.appendChild(btn); box.appendChild(el);
      });
    }).catch(function (e) { /* خارج از مینی‌اپ رسمی VIVA */ });
  }
  function joinRoom(id) {
    Viva.rooms.join(id).then(function () {
      myRoomId = id;
      return Viva.connectRoom(id);
    }).catch(function (e) { toast(e.message || "پیوستن ناموفق"); });
  }
  $("make-btn").addEventListener("click", function () {
    var o = CLOCK_OPTS[clockSel];
    Viva.rooms.create("chess", 2, { initial_seconds: o.initial, increment_seconds: o.inc })
      .then(function (d) { joinRoom(d.room.room_id); })
      .catch(function (e) { toast(e.message || "ساخت میز ناموفق"); });
  });
  $("start-btn").addEventListener("click", function () {
    if (myRoomId) Viva.rooms.start(myRoomId).catch(function (e) { toast(e.message || "شروع ناموفق"); });
  });
  $("leave-btn").addEventListener("click", function () {
    if (!myRoomId) return;
    Viva.rooms.leave(myRoomId).then(function () {
      myRoomId = null; Viva.disconnect(); lastState = null;
      $("my-room").classList.add("hidden"); $("room-make").classList.remove("hidden");
      refreshRooms();
    });
  });
  $("res-back").addEventListener("click", function () { location.reload(); });
  $("resign-btn").addEventListener("click", function () {
    if (confirm("از مسابقه استعفا می‌دهی؟")) Viva.action({ type: "resign" });
  });
  $("draw-btn").addEventListener("click", function () {
    Viva.action({ type: "offer_draw" }); toast("پیشنهاد تساوی ارسال شد");
  });
  $("sound").addEventListener("click", toggleSound);

  // شروع
  Viva.ensureLogin().then(function () {
    myId = Viva.me() && Viva.me().id;
    return fetch("/health").then(function (res) {
      var d = res.headers.get("date");
      if (d) serverOffset = new Date(d).getTime() / 1000 - Date.now() / 1000;
    });
  }).then(function () {
    renderClockPills(); refreshRooms();
    setInterval(refreshRooms, 5000);
    setInterval(function () { if (lastState && lastState.status === "playing") renderClocks(lastState.match, lastState.match.you.color === "white" ? "black" : "white", lastState.match.you.color); }, 1000);
  }).catch(function (e) {
    toast(e.message === "VIVA_LOGIN_REQUIRES_BALE" ? "ورود واقعی فقط داخل مینی‌اپ بله انجام می‌شود." : "ورود ناموفق");
  });
})();
</script>
</body>
</html>
