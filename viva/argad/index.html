<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0906" />
<title>آرگاد — تالار شطرنج | VIVA</title>
<link rel="icon" href="data:," />
<script src="https://tapi.bale.ai/miniapp.js"></script>
<style>
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #0b0906; color: #efe4cc; font-family: "Vazirmatn", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 14px calc(24px + env(safe-area-inset-bottom)); }

.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 2px 8px; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(217,169,60,0.4);
  background: rgba(18,14,8,0.7); color: #e8d9a8; font-size: 18px; display: grid; place-items: center; text-decoration: none; }
.tb-title b { font-size: 15px; font-weight: 900; color: #ffe9a8; display: block; }
.tb-title span { font-size: 10px; color: #9a9178; letter-spacing: 2px; }
.net { margin-inline-start: auto; display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: #9a9178;
  border: 1px solid rgba(217,169,60,0.3); border-radius: 999px; padding: 6px 11px; background: rgba(8,10,18,0.6); }
.net .d { width: 7px; height: 7px; border-radius: 50%; background: #9a8f8f; }
.net.on { color: #9fe8b0; border-color: rgba(122,232,138,0.4); } .net.on .d { background: #7ae88a; }
.net.off { color: #ffb391; border-color: rgba(255,106,61,0.4); } .net.off .d { background: #ff6a3d; }

/* ---------- صحنهٔ اتاق اشرافی ---------- */
.room { position: relative; height: 240px; border-radius: 22px; overflow: hidden; margin: 10px 0 14px;
  border: 1px solid rgba(217,169,60,0.35); box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.5);
  background: linear-gradient(180deg, #17110b 0%, #241a10 60%, #17110b 100%); }
.window { position: absolute; top: 16px; right: 20px; width: 120px; height: 170px; border-radius: 10px;
  border: 5px solid #3a2a16; box-shadow: 0 0 30px rgba(255,190,90,0.15), inset 0 0 18px rgba(0,0,0,0.35);
  overflow: hidden; background: linear-gradient(180deg, #6fa3d8 0%, #a8cbe8 45%, #d8c9a0 62%, #5d7a48 62%, #40592f 100%); }
.window .sun { position: absolute; top: 18px; left: 22px; width: 26px; height: 26px; border-radius: 50%;
  background: radial-gradient(circle, #fff2c0 0%, #ffd66b 60%, transparent 75%); animation: sunray 6s ease-in-out infinite alternate; }
@keyframes sunray { from { filter: brightness(1); } to { filter: brightness(1.25); } }
.window .cloud { position: absolute; top: 26px; width: 44px; height: 12px; border-radius: 999px;
  background: rgba(255,255,255,0.75); animation: drift 17s linear infinite; }
.window .cloud.c2 { top: 48px; width: 30px; animation-duration: 24s; animation-delay: -8s; opacity: 0.65; }
@keyframes drift { from { left: -60px; } to { left: 140px; } }
.window .hills { position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
  background:
    radial-gradient(60% 90% at 30% 100%, #3e5a30 0%, transparent 70%),
    radial-gradient(50% 80% at 75% 100%, #33492a 0%, transparent 70%); }
.window .tower { position: absolute; bottom: 34px; left: 34px; width: 12px; height: 34px; background: #4a4034;
  clip-path: polygon(0 100%, 0 30%, 50% 0, 100% 30%, 100% 100%); opacity: 0.85; }
.mullion { position: absolute; inset: 0; pointer-events: none; }
.mullion::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; background: #3a2a16; }
.mullion::after { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 4px; background: #3a2a16; }
.carpet { position: absolute; bottom: 0; left: 0; right: 0; height: 58px;
  background:
    repeating-linear-gradient(90deg, rgba(140,30,40,0.5) 0 14px, rgba(110,20,30,0.5) 14px 28px),
    linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.35)); }
.table2 { position: absolute; left: 34px; bottom: 18px; width: 42%; height: 88px;
  background:
    radial-gradient(120% 120% at 50% 15%, rgba(255,200,120,0.18) 0%, transparent 40%),
    repeating-linear-gradient(0deg, #5a3a1e 0 4px, #4a2e16 4px 8px);
  border: 3px solid #2e1c0c; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); }
.candle2 { position: absolute; right: 30%; bottom: 60px; width: 7px; height: 22px;
  background: linear-gradient(180deg, #e8d9b0, #b89b6e); border-radius: 2px; }
.candle2::after { content: ""; position: absolute; top: -11px; left: 50%; transform: translateX(-50%); width: 7px; height: 12px;
  background: radial-gradient(50% 65% at 50% 75%, #fff6c8 0%, #ffcf6b 45%, #ff8a3d 75%, transparent 100%);
  border-radius: 50%; animation: fl 1.6s ease-in-out infinite alternate; box-shadow: 0 0 16px 5px rgba(255,170,70,0.25); }
@keyframes fl { from { transform: translateX(-50%) scale(1) rotate(-3deg); } to { transform: translateX(-46%) scale(1.06,0.94) rotate(3deg); } }

/* ---------- صفحهٔ شطرنج ---------- */
.board-zone { background: linear-gradient(180deg, rgba(26,20,12,0.94), rgba(16,12,8,0.96));
  border: 1px solid rgba(217,169,60,0.35); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.names { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
.names .pl { display: flex; align-items: center; gap: 7px; }
.names .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #666; }
.names .dot.w { background: #f5e6bd; } .names .dot.b { background: #1c120a; border-color: #d9a93c; }
.names .turn { font-size: 10.5px; color: #ffd98a; border: 1px solid rgba(217,169,60,0.4); border-radius: 999px; padding: 4px 10px; }
.clockrow { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; color: #ffe9a8;
  font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1;
  border: 6px solid #2e1c0c; border-radius: 10px; overflow: hidden; direction: ltr;
  box-shadow: 0 14px 34px rgba(0,0,0,0.6); user-select: none; touch-action: manipulation; }
.sq { position: relative; display: grid; place-items: center; cursor: pointer; }
.sq.light { background: linear-gradient(180deg, #d8b878, #c9a76a); }
.sq.dark { background: linear-gradient(180deg, #8a5f36, #7a5230); }
.sq .pc { font-size: min(9vw, 38px); line-height: 1; z-index: 2; pointer-events: none;
  text-shadow: 0 2px 3px rgba(0,0,0,0.5); }
.sq.w .pc { color: #f8ecd0; text-shadow: 0 1px 0 #7a5a30, 0 2px 4px rgba(0,0,0,0.6); }
.sq.b .pc { color: #221208; text-shadow: 0 1px 0 rgba(255,210,140,0.35), 0 2px 3px rgba(0,0,0,0.5); }
.sq.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #ffd98a; }
.sq.legal::before { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%;
  background: rgba(122,232,138,0.55); box-shadow: 0 0 10px rgba(122,232,138,0.7); z-index: 1; }
.sq.legal.capture::before { width: 88%; height: 88%; border-radius: 50%; background: transparent;
  box-shadow: inset 0 0 0 4px rgba(255,110,110,0.75); }
.sq.lastmove::after { content: ""; position: absolute; inset: 0; background: rgba(255,217,138,0.22); }
.sq.check::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle, rgba(255,60,60,0.55) 0%, transparent 70%); }
.history { margin-top: 9px; font-size: 11px; color: #b8ab8a; direction: ltr; text-align: left; max-height: 52px; overflow-y: auto; }

.panel { background: linear-gradient(180deg, rgba(24,18,10,0.94), rgba(16,12,8,0.96));
  border: 1px solid rgba(217,169,60,0.30); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.phase-row { display: flex; align-items: center; gap: 10px; }
.phase-badge { font-size: 12px; font-weight: 900; padding: 7px 13px; border-radius: 999px;
  background: rgba(217,169,60,0.14); border: 1px solid rgba(217,169,60,0.5); color: #ffe9a8; }
.phase-msg { margin-top: 10px; font-size: 12.5px; color: #c9bc99; line-height: 2; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { border: 1px solid rgba(217,169,60,0.4); background: rgba(217,169,60,0.08); color: #e8d9a8;
  border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 700; font-family: inherit; }
.pill.sel { background: #d9a93c; color: #241505; }
.big-btn { width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 14px;
  background: linear-gradient(180deg, #ffd98a, #d9a93c); color: #241505; font-family: inherit; font-weight: 900; font-size: 15px;
  box-shadow: 0 10px 26px rgba(217,169,60,0.3); }
.big-btn:disabled { opacity: 0.4; }
.big-btn.danger { background: linear-gradient(180deg, #b0673a, #7a3a1e); color: #ffe4d0; }
.rooms-list { display: grid; gap: 9px; margin-top: 10px; }
.room-card { display: flex; align-items: center; gap: 10px; background: rgba(20,14,8,0.85);
  border: 1px solid rgba(217,169,60,0.3); border-radius: 14px; padding: 11px 13px; font-size: 12.5px; }
.room-card b { color: #ffd98a; }
.room-card .join { margin-inline-start: auto; background: #d9a93c; border: 0; color: #241505; border-radius: 10px;
  padding: 8px 14px; font-family: inherit; font-weight: 900; font-size: 12px; }
.btnrow { display: flex; gap: 8px; margin-top: 10px; }
.btnrow .big-btn { margin-top: 0; }
.overlay { position: fixed; inset: 0; background: rgba(6,4,2,0.92); display: grid; place-items: center; z-index: 50; padding: 20px; }
.overlay .card { max-width: 420px; width: 100%; background: linear-gradient(180deg, #221a10, #140f08);
  border: 1px solid rgba(217,169,60,0.5); border-radius: 22px; padding: 22px; text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
.overlay h2 { font-size: 21px; font-weight: 900; margin: 8px 0 4px; color: #ffe9a8; }
.overlay .rw { margin-top: 10px; font-size: 12.5px; color: #ffd98a; }
.overlay .back-btn { margin-top: 16px; width: 100%; border: 0; border-radius: 14px; padding: 13px;
  background: linear-gradient(180deg, #ffd98a, #d9a93c); color: #241505; font-family: inherit; font-weight: 900; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(32,22,8,0.95);
  border: 1px solid rgba(217,169,60,0.5); color: #ffe9c9; padding: 10px 16px; border-radius: 12px; font-size: 12px; z-index: 60; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="/viva/" aria-label="بازگشت">›</a>
    <div class="tb-title"><b>تالار آرگاد</b><span>ARGAD · CHESS HALL</span></div>
    <div class="net" id="net"><span class="d"></span><span id="net-t">…</span></div>
  </header>

  <section class="room" aria-hidden="true">
    <div class="window">
      <div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div>
      <div class="tower"></div><div class="hills"></div><div class="mullion"></div>
    </div>
    <div class="table2"></div>
    <div class="candle2"></div>
    <div class="carpet"></div>
  </section>

  <!-- لابی -->
  <section id="lobby">
    <div class="panel">
      <div class="phase-row"><span class="phase-badge">لابی تالار</span></div>
      <div class="phase-msg">شطرنج دو نفره با قوانین کامل سرور: کیش، مات، پات، تساوی، آن‌پاسان، قلعه و ارتقا.
      یک ساعت انتخاب کن و اتاق بساز؛ حریف دوم می‌پیوندد.</div>
      <div id="my-room" class="hidden">
        <div class="phase-msg" id="my-room-info"></div>
        <button class="big-btn" id="start-btn">آغاز مسابقه</button>
        <button class="big-btn danger" id="leave-btn">خروج از اتاق</button>
      </div>
      <div id="room-make">
        <div class="pill-row" id="clock-pills"></div>
        <button class="big-btn" id="make-btn">ساخت میز بازی</button>
      </div>
      <div class="rooms-list" id="rooms-list"></div>
    </div>
  </section>

  <!-- مسابقه -->
  <section id="match" class="hidden">
    <div class="board-zone">
      <div class="names">
        <span class="pl"><span class="dot" id="dot-top"></span><b id="name-top">—</b><span class="clock" id="clock-top"></span></span>
        <span class="turn" id="turn-badge">…</span>
      </div>
      <div class="board" id="board" dir="ltr"></div>
      <div class="names" style="margin-top:8px">
        <span class="pl"><span class="dot" id="dot-bottom"></span><b id="name-bottom">—</b><span class="clock" id="clock-bottom"></span></span>
        <span style="font-size:10.5px;color:#9a9178" id="check-badge"></span>
      </div>
      <div class="history" id="history"></div>
    </div>
    <div class="panel">
      <div class="phase-msg" id="phase-msg">…</div>
      <div class="btnrow">
        <button class="big-btn danger" id="resign-btn">استعفا</button>
        <button class="big-btn" id="draw-btn">پیشنهاد تساوی</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay hidden" id="result-overlay">
  <div class="card">
    <div style="font-size:34px">♛</div>
    <h2 id="res-title">—</h2>
    <div class="phase-msg" id="res-sub"></div>
    <div class="rw" id="res-rw"></div>
    <button class="back-btn" id="res-back">بازگشت به تالار</button>
  </div>
</div>

<script src="../live.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var myId = null, serverOffset = 0;
  var lastState = null, match = null;
  var selected = null;         // خانهٔ انتخاب‌شده "e2"
  var legalByFrom = {};        // e2 → ["e3","e4",...]
  var lastMoveUci = null;
  var myRoomId = null;

  var GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  var CLOCK_OPTS = [
    { label: "بدون ساعت", initial: 0, inc: 0 },
    { label: "۵ + ۰", initial: 300, inc: 0 },
    { label: "۱۰ + ۰", initial: 600, inc: 0 }
  ], clockSel = 1;

  function now() { return Date.now() / 1000 + serverOffset; }
  function toast(text) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }

  Viva.on("status", function (s) {
    var n = $("net");
    n.className = "net " + (s === "online" ? "on" : s === "offline" ? "off" : "");
    $("net-t").textContent = s === "online" ? "متصل" : s === "offline" ? "قطع" : "…";
  });
  Viva.on("state", function (st) { lastState = st; renderState(st); });
  Viva.on("event", function (ev) {
    if (!ev || !ev.type) return;
    switch (ev.type) {
      case "move":
        lastMoveUci = ev.uci;
        if (ev.check) toast("کیش!");
        if (lastState) renderBoard(lastState);
        break;
      case "match_start":
        toast("مسابقه آغاز شد!");
        break;
      case "draw_offer":
        if (confirm("حریف پیشنهاد تساوی داده. می‌پذیری؟")) Viva.action({ type: "accept_draw" });
        break;
      case "match_finished":
        showResult(ev);
        break;
      case "server_error":
        if (ev.msg === "rate_limited") toast("آهسته‌تر!");
        break;
    }
  });

  // --- رندر صفحه ---
  function pieceAt(fen, file, rank) {
    // fen شمارش رنک از ۸ تا ۱
    var rows = fen.split(" ")[0].split("/");
    var row = rows[7 - rank]; // rank 0 = رنک ۱
    var f = 0;
    for (var i = 0; i < row.length; i++) {
      var ch = row[i];
      if (ch >= "1" && ch <= "8") { f += parseInt(ch, 10); continue; }
      if (f === file) return ch;
      f++;
    }
    return null;
  }

  function renderBoard(st) {
    match = st.match || match;
    if (!match) return;
    var board = $("board");
    board.innerHTML = "";
    var fen = match.fen;
    var legal = (match.you && match.you.legal_moves) || [];
    legalByFrom = {};
    legal.forEach(function (u) {
      var from = u.slice(0, 2);
      (legalByFrom[from] = legalByFrom[from] || []).push(u);
    });
    var myTurn = match.you && match.you.color === match.turn && !match.winner;
    for (var rank = 7; rank >= 0; rank--) {
      for (var file = 0; file < 8; file++) {
        var sq = document.createElement("div");
        var isLight = (file + rank) % 2 === 1;
        sq.className = "sq " + (isLight ? "light" : "dark");
        var name = "abcdefgh"[file] + (rank + 1);
        sq.dataset.sq = name;
        var pc = pieceAt(fen, file, rank);
        if (pc) {
          sq.classList.add(pc === pc.toUpperCase() ? "w" : "b");
          var span = document.createElement("span");
          span.className = "pc";
          span.textContent = GLYPH[pc.toLowerCase()];
          sq.appendChild(span);
        }
        if (selected === name) sq.classList.add("sel");
        if (lastMoveUci && (lastMoveUci.slice(0, 2) === name || lastMoveUci.slice(2, 4) === name)) sq.classList.add("lastmove");
        if (myTurn && legalByFrom[name]) {
          legalByFrom[name].forEach(function (u) {
            // نشانه‌گذاری خانه‌های مقصد بعداً
          });
        }
        sq.addEventListener("click", function () { onSquare(this.dataset.sq); });
        board.appendChild(sq);
      }
    }
    // نشانه‌های حرکت مجاز
    if (selected && legalByFrom[selected]) {
      legalByFrom[selected].forEach(function (u) {
        var to = u.slice(2, 4);
        var el = board.querySelector('[data-sq="' + to + '"]');
        if (el) el.classList.add("legal" + (pieceAt(fen, "abcdefgh".indexOf(to[0]), parseInt(to[1], 10) - 1) ? " capture" : ""));
      });
    }
    if (match.check && !match.winner) {
      var kSq = findKing(fen, match.turn);
      if (kSq) { var el = board.querySelector('[data-sq="' + kSq + '"]'); if (el) el.classList.add("check"); }
    }
    // نام‌ها و رنگ‌ها
    var myColor = match.you ? match.you.color : null;
    var topColor = myColor === "white" ? "black" : "white";
    var nameByColor = { white: match.white ? nameOf(match.white) : "سفید", black: match.black ? nameOf(match.black) : "سیاه" };
    $("name-top").textContent = nameByColor[topColor];
    $("name-bottom").textContent = nameByColor[myColor || "white"];
    $("dot-top").className = "dot " + topColor[0];
    $("dot-bottom").className = "dot " + (myColor || "white")[0];
    $("turn-badge").textContent = match.winner ? "پایان" : (match.turn === "white" ? "نوبت سفید" : "نوبت سیاه");
    $("check-badge").textContent = match.check && !match.winner ? "⚠️ کیش!" : "";
    // ساعت
    renderClocks(match, topColor, myColor);
    // تاریخچه
    var h = $("history");
    h.textContent = (match.history_san || []).map(function (s, i) { return (i % 2 === 0 ? (i / 2 + 1) + ". " : "") + s; }).join("  ");
    h.scrollTop = h.scrollHeight;
    // پیام وضعیت
    var msg = $("phase-msg");
    if (match.winner) msg.textContent = "مسابقه پایان یافت.";
    else if (myTurn) msg.textContent = selected ? "خانهٔ مقصد را بزن." : "نوبت شماست — مهره‌ای را انتخاب کن.";
    else msg.textContent = "نوبت حریف است…";
  }

  function renderClocks(match, topColor, myColor) {
    var c = match.clock;
    if (!c) { $("clock-top").textContent = ""; $("clock-bottom").textContent = ""; return; }
    $("clock-top").textContent = fmt(c[topColor]);
    $("clock-bottom").textContent = fmt(c[myColor || "white"]);
    function fmt(sec) {
      if (sec === undefined || sec === null) return "";
      sec = Math.max(0, sec);
      var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" + s : s);
    }
  }

  function findKing(fen, color) {
    var target = color === "white" ? "K" : "k";
    var rows = fen.split(" ")[0].split("/");
    for (var r = 0; r < 8; r++) {
      var f = 0;
      for (var i = 0; i < rows[r].length; i++) {
        var ch = rows[r][i];
        if (ch >= "1" && ch <= "8") { f += parseInt(ch, 10); continue; }
        if (ch === target) return "abcdefgh"[f] + (8 - r);
        f++;
      }
    }
    return null;
  }

  function onSquare(sqName) {
    if (!match || match.winner) return;
    if (!(match.you && match.you.color === match.turn)) { toast("نوبت شما نیست"); return; }
    var moves = legalByFrom[sqName];
    if (moves) {
      selected = (selected === sqName) ? null : sqName;
    } else if (selected) {
      var uci = null;
      (legalByFrom[selected] || []).forEach(function (u) {
        if (u.slice(2, 4) === sqName) uci = u;
      });
      if (uci) {
        // ارتقا: پیش‌فرض وزیر
        if (uci.length === 4) {
          var pc = pieceAt(match.fen, "abcdefgh".indexOf(selected[0]), parseInt(selected[1], 10) - 1);
          if (pc && pc.toLowerCase() === "p" && (sqName[1] === "8" || sqName[1] === "1")) uci += "q";
        }
        Viva.action({ type: "move", move: uci });
        selected = null;
      } else {
        selected = null;
      }
    } else {
      selected = null;
    }
    if (lastState) renderBoard(lastState);
  }

  function nameOf(accountId) {
    if (!lastState) return accountId;
    for (var i = 0; i < lastState.players.length; i++)
      if (lastState.players[i].account_id === accountId) return lastState.players[i].display_name;
    return accountId.slice(0, 6);
  }

  function renderState(st) {
    if (!st) return;
    if (st.status === "lobby" || st.status === "closed") {
      $("match").classList.add("hidden");
      $("lobby").classList.remove("hidden");
      var mine = st.players.some(function (p) { return p.account_id === myId; });
      if (mine) {
        $("my-room").classList.remove("hidden");
        $("room-make").classList.add("hidden");
        $("my-room-info").textContent = "میز شما: " + st.players.length + "/2 — " +
          st.players.map(function (p) { return p.display_name; }).join(" در برابر ");
        $("start-btn").disabled = st.host !== myId || st.players.length < 2;
        $("start-btn").textContent = st.host !== myId ? "انتظار برای میزبان…" :
          st.players.length < 2 ? "در انتظار حریف دوم…" : "آغاز مسابقه";
      } else {
        $("my-room").classList.add("hidden");
        $("room-make").classList.remove("hidden");
      }
    } else {
      $("lobby").classList.add("hidden");
      $("match").classList.remove("hidden");
      renderBoard(st);
    }
  }

  function showResult(ev) {
    var r = ev.result || {};
    var titles = { checkmate: "کیش و مات!", resignation: "استعفا", timeout: "اتمام وقت", forfeit_disconnect: "قطع اتصال حریف",
      forfeit_leave: "خروج حریف", stalemate: "پات — مساوی", threefold_repetition: "تکرار سه‌باره — مساوی",
      fifty_move: "قاعدهٔ ۵۰ حرکت — مساوی", insufficient_material: "قدرت‌ناقص — مساوی", agreement: "تساوی با توافق" };
    var title;
    if (r.winner === "draw") title = "مساوی 🤝";
    else title = (r.winner === "white" ? "سفید برد! ♔" : "سیاه برد! ♚") + " — " + (titles[r.reason] || "");
    $("res-title").textContent = title;
    $("res-sub").textContent = "دلیل: " + (titles[r.reason] || r.reason || "—");
    var rw = r.rewards || {};
    $("res-rw").textContent = myId && rw[myId] !== undefined ? "پاداش شما: " + rw[myId] + " توکن VIVA" : "";
    $("result-overlay").classList.remove("hidden");
  }

  // --- لابی ---
  function renderClockPills() {
    var box = $("clock-pills"); box.innerHTML = "";
    CLOCK_OPTS.forEach(function (o, i) {
      var b = document.createElement("button");
      b.className = "pill" + (i === clockSel ? " sel" : "");
      b.textContent = o.label;
      b.addEventListener("click", function () { clockSel = i; renderClockPills(); });
      box.appendChild(b);
    });
  }
  function refreshRooms() {
    if (lastState && (lastState.status === "playing" || lastState.status === "finished")) return;
    Viva.rooms.list("chess").then(function (d) {
      var box = $("rooms-list"); box.innerHTML = "";
      if (!d.rooms.length) { box.innerHTML = '<div class="room-card">هنوز میزی نیست — اولین میز را بساز!</div>'; return; }
      d.rooms.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "room-card";
        el.innerHTML = "<span>♛ <b>" + r.host_name + "</b> · " + r.seated + "/" + r.capacity +
          (r.status === "playing" ? " · در جریان" : "") + "</span>";
        var btn = document.createElement("button");
        btn.className = "join"; btn.textContent = r.status === "lobby" ? "پیوستن" : "تماشا";
        btn.addEventListener("click", function () { joinRoom(r.room_id); });
        el.appendChild(btn); box.appendChild(el);
      });
    }).catch(function (e) { /* خارج از بله */ });
  }
  function joinRoom(id) {
    Viva.rooms.join(id).then(function () {
      myRoomId = id;
      return Viva.connectRoom(id);
    }).catch(function (e) { toast(e.message || "پیوستن ناموفق"); });
  }
  $("make-btn").addEventListener("click", function () {
    var o = CLOCK_OPTS[clockSel];
    Viva.rooms.create("chess", 2, { initial_seconds: o.initial, increment_seconds: o.inc })
      .then(function (d) { joinRoom(d.room.room_id); })
      .catch(function (e) { toast(e.message || "ساخت میز ناموفق"); });
  });
  $("start-btn").addEventListener("click", function () {
    if (myRoomId) Viva.rooms.start(myRoomId).catch(function (e) { toast(e.message || "شروع ناموفق"); });
  });
  $("leave-btn").addEventListener("click", function () {
    if (!myRoomId) return;
    Viva.rooms.leave(myRoomId).then(function () {
      myRoomId = null; Viva.disconnect(); lastState = null;
      $("my-room").classList.add("hidden"); $("room-make").classList.remove("hidden");
      refreshRooms();
    });
  });
  $("res-back").addEventListener("click", function () { location.reload(); });
  $("resign-btn").addEventListener("click", function () {
    if (confirm("از مسابقه استعفا می‌دهی؟")) Viva.action({ type: "resign" });
  });
  $("draw-btn").addEventListener("click", function () {
    Viva.action({ type: "offer_draw" }); toast("پیشنهاد تساوی ارسال شد");
  });

  // شروع
  Viva.ensureLogin().then(function () {
    myId = Viva.me() && Viva.me().id;
    return fetch("/health").then(function (res) {
      var d = res.headers.get("date");
      if (d) serverOffset = new Date(d).getTime() / 1000 - Date.now() / 1000;
    });
  }).then(function () {
    renderClockPills(); refreshRooms();
    setInterval(refreshRooms, 5000);
    setInterval(function () { if (lastState && lastState.status === "playing") renderClocks(lastState.match, lastState.match.you.color === "white" ? "black" : "white", lastState.match.you.color); }, 1000);
  }).catch(function (e) {
    toast(e.message === "outside_bale" ? "ورود واقعی فقط داخل مینی‌اپ بله انجام می‌شود." : "ورود ناموفق");
  });
})();
</script>
</body>
</html>
