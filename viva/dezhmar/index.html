<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120a08" />
<title>دژمار — تالار مافیا | VIVA</title>
<link rel="icon" href="data:," />
<script src="https://tapi.bale.ai/miniapp.js"></script>
<link rel="stylesheet" href="../assets/hall-theme.css" />
<style>
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../../game/gates/assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

/* ---------- اختصاصی دژمار: کارت نقش و چت ---------- */
.role-card { margin-top: 12px; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, rgba(96,34,50,0.75), rgba(40,12,22,0.9));
  border: 1px dashed rgba(255,150,150,0.5); box-shadow: inset 0 1px 0 rgba(255,200,200,0.15); }
.role-card .ico { font-size: 26px; }
.role-card b { color: #ffd98a; font-size: 14px; display: block; }
.role-card small { color: #d8bfae; font-size: 11px; line-height: 1.9; display: block; }
.targets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tbtn { border: 1px solid rgba(255,120,120,0.6); color: #ffb8b8; border-radius: 12px; padding: 9px 13px;
  font-size: 12.5px; font-weight: 700; font-family: inherit;
  background: linear-gradient(180deg, rgba(150,30,50,0.35), rgba(80,14,28,0.5));
  box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,180,180,0.2); }
.tbtn:active { transform: scale(0.95); }
.tbtn.vote { border-color: rgba(130,155,255,0.6); color: #c8d4ff;
  background: linear-gradient(180deg, rgba(50,60,120,0.35), rgba(24,28,64,0.5)); }
.chat { height: 130px; overflow-y: auto; border-radius: 14px; padding: 10px; margin-top: 10px; font-size: 12px; line-height: 2;
  background: linear-gradient(180deg, rgba(20,10,14,0.7), rgba(10,6,8,0.8));
  border: 1px solid rgba(226,178,84,0.28); }
.chat p b { color: #ff9e9e; } .chat p span { color: #e6d6b4; } .chat p.sys { color: #a2946e; font-size: 11px; }
.chat-input { display: flex; gap: 8px; margin-top: 8px; }
.chat-input input { flex: 1; border-radius: 12px; padding: 10px 12px; color: #f2e8d5; font-family: inherit; font-size: 13px; outline: none;
  background: linear-gradient(180deg, rgba(16,8,12,0.8), rgba(8,4,6,0.9));
  border: 1px solid rgba(226,178,84,0.4); }
.chat-input input:focus { border-color: rgba(255,217,138,0.7); }
.chat-input button { border: 0; color: #fff; border-radius: 12px; padding: 0 16px; font-family: inherit; font-weight: 900; font-size: 13px;
  background: linear-gradient(180deg, #e0304a, #a00d24);
  box-shadow: 0 8px 18px rgba(200,16,46,0.4), inset 0 1px 0 rgba(255,200,200,0.4); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="/viva/" aria-label="بازگشت">›</a>
    <div class="tb-title"><b>تالار دژمار</b><span>DEZHMAAR · MAFIA HALL</span></div>
    <button class="sound" id="sound" aria-label="صدا">🔇</button>
    <div class="net" id="net"><span class="d"></span><span id="net-t">…</span></div>
  </header>

  <!-- صحنهٔ سینمایی تالار: بوم Phaser (اتاق بارانی، میز مافیا، شمع، مه) -->
  <section class="hall-stage" aria-label="صحنهٔ تالار دژمار">
    <div id="hall-canvas" style="position:absolute;inset:0"></div>
    <div class="seats" id="seats"></div>
    <div class="frame-glow"></div>
  </section>

  <!-- لابی -->
  <section id="lobby">
    <div class="panel">
      <div class="phase-row"><span class="phase-badge">لابی تالار</span>
        <span class="timer" id="lobby-count">…</span></div>
      <div class="phase-msg">اتاق بساز یا به مسابقهٔ در انتظار بپیوند. مافیا حداقل ۵ و حداکثر ۱۲ بازیکن می‌خواهد.</div>
      <div id="my-room" class="hidden">
        <div class="phase-msg" id="my-room-info"></div>
        <button class="big-btn gold" id="start-btn">آغاز مسابقه</button>
        <button class="big-btn" id="leave-btn" style="background:linear-gradient(180deg,#5a2230,#3a141e)">خروج از اتاق</button>
      </div>
      <div id="room-make">
        <div class="pill-row" id="speed-pills"></div>
        <div class="pill-row" id="cap-pills"></div>
        <button class="big-btn" id="make-btn">ساخت اتاق مخفی</button>
      </div>
      <div class="rooms-list" id="rooms-list"></div>
    </div>
  </section>

  <!-- مسابقه -->
  <section id="match" class="hidden">
    <div class="panel">
      <div class="phase-row">
        <span class="phase-badge" id="phase-badge">شب</span>
        <span class="timer" id="timer">--</span>
      </div>
      <div class="phase-msg" id="phase-msg">…</div>
      <div class="role-card hidden" id="role-card">
        <span class="ico" id="role-ico">🎭</span>
        <span><b id="role-title">نقش شما</b><small id="role-desc">…</small></span>
      </div>
      <div class="targets hidden" id="targets"></div>
      <div id="talk-box" class="hidden">
        <div class="chat" id="chat"></div>
        <div class="chat-input">
          <input id="chat-text" maxlength="200" placeholder="در روز صحبت کن…" />
          <button id="chat-send">ارسال</button>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<div class="overlay hidden" id="result-overlay">
  <div class="card">
    <div style="font-size:34px">🏆</div>
    <h2 id="res-title">—</h2>
    <div class="roles" id="res-roles"></div>
    <div class="rw" id="res-rw"></div>
    <button class="back-btn" id="res-back">بازگشت به تالار</button>
  </div>
</div>

<script src="../vendor/howler.min.js"></script>
<script src="../vendor/phaser.min.js"></script>
<script src="../assets/viva-halls.js"></script>
<script src="../live.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var myId = null, myName = null;
  var serverOffset = 0; // ثانیه — اختلاف ساعت سرور و دستگاه
  var lastState = null;
  var myRole = null, myRoleMeta = null;
  var picks = {};        // vote: voter→target
  var mafiaPicks = {};
  var phaseDeadline = null, phaseName = null, dayNo = 0;
  var targeting = null;  // {as, targets}
  var meDead = false;

  // صحنهٔ سینمایی تالار
  var hallGame = VivaHalls.bootRoom($("hall-canvas"), "dezhmar");

  var ROLE_INFO = {
    mafia:     { ico: "🩸", title: "مافیا", desc: "شب با هم‌تیمی‌هایت یک هدف مشترک انتخاب کن؛ روز وانمود کن شهروندی." },
    doctor:    { ico: "🩺", title: "دکتر", desc: "هر شب یک نفر را نجات بده. خودت را فقط یک‌بار در کل بازی می‌توانی نجات دهی." },
    detective: { ico: "🔍", title: "کارآگاه", desc: "هر شب هویت یک نفر را بررسی کن؛ نتیجه فقط برای خودت می‌آید." },
    citizen:   { ico: "🧑‍🌾", title: "شهروند", desc: "با استدلال و رأی روز، مافیا را بیرون بینداز." }
  };

  function now() { return Date.now() / 1000 + serverOffset; }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m > 0 ? m + ":" : "") + (s < 10 ? "0" + s : s);
  }

  function toast(text) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  // --- صدا: باران + شومینه (Howler) ---
  var AMBIENT_MIX = {
    loops: [
      { src: "../assets/audio/rain.mp3", vol: 0.16 },
      { src: "../assets/audio/fire.mp3", vol: 0.22 }
    ]
  };
  function toggleSound() {
    var on = VivaAudio.toggle(AMBIENT_MIX);
    $("sound").textContent = on ? "🔊" : "🔇";
    if (!on) return;
    try { VivaHalls.setMood(hallGame, phaseName === "night_pick" ? "night" : "day"); } catch (e) {}
  }

  // --- شبکه ---
  Viva.on("status", function (s) {
    var n = $("net");
    n.className = "net " + (s === "online" ? "on" : s === "offline" ? "off" : "");
    $("net-t").textContent = s === "online" ? "متصل" : s === "offline" ? "قطع" : "…";
  });

  Viva.on("state", function (st) { lastState = st; renderState(st); });
  Viva.on("event", function (ev) { handleEvent(ev); });

  function handleEvent(ev) {
    if (!ev || !ev.type) return;
    switch (ev.type) {
      case "your_role":
        myRole = ev.role; myRoleMeta = ROLE_INFO[ev.role];
        if (myRoleMeta) {
          var d = myRoleMeta.desc;
          if (ev.role === "mafia" && ev.teammates && ev.teammates.length) {
            d += " هم‌تیمی: " + ev.teammates.map(nameOf).join("، ");
          }
          $("role-card").classList.remove("hidden");
          $("role-ico").textContent = myRoleMeta.ico;
          $("role-title").textContent = "نقش محرمانهٔ شما: " + myRoleMeta.title;
          $("role-desc").textContent = d;
        }
        break;
      case "phase":
        phaseName = ev.phase; phaseDeadline = ev.deadline; dayNo = ev.day;
        $("targets").classList.add("hidden"); targeting = null;
        renderPhase();
        // نورپردازی صحنه با فاز بازی هم‌گام می‌شود
        VivaHalls.setMood(hallGame, ev.phase === "night_pick" ? "night" : ev.phase === "day_vote" ? "vote" : "day");
        if (ev.phase === "day_talk") $("talk-box").classList.remove("hidden");
        else $("talk-box").classList.add("hidden");
        if (ev.phase === "day_vote") log("🗳️ رأی‌گیری آغاز شد؛ یک نفر را انتخاب کن.");
        if (ev.phase === "night_pick") log("🌙 شب " + ev.day + " فرا رسید.");
        // صندلی‌ها باید با فاز تازه دوباره رندر شوند (هندلرهای رأی/هدف)
        if (lastState) renderSeats(lastState);
        Viva.refresh();
        break;
      case "night_request":
        targeting = { as: ev.as, targets: ev.targets };
        renderTargets();
        break;
      case "night_ok":
        toast("انتخاب شب ثبت شد ✔");
        $("targets").classList.add("hidden");
        break;
      case "mafia_picks":
        mafiaPicks = ev.picks || {};
        if (myRole === "mafia") {
          var names = Object.keys(mafiaPicks).map(function (k) { return nameOf(k) + " ← " + nameOf(mafiaPicks[k]); });
          if (names.length) log("🩸 انتخاب مافیا تا این لحظه: " + names.join(" | "));
        }
        break;
      case "detective_result":
        toast(ev.is_mafia ? "🔍 " + nameOf(ev.target) + " مافیا است!" : "🔍 " + nameOf(ev.target) + " مافیا نیست.");
        log("🔍 نتیجهٔ محرمانه: " + nameOf(ev.target) + (ev.is_mafia ? " مافیا است." : " مافیا نیست."));
        break;
      case "dawn":
        if (ev.died) log("🌅 سپیده دمید؛ " + nameOf(ev.died) + " شب گذشته به قتل رسید" + (ev.role ? " (نقش: " + ev.role + ")" : "") + ".");
        else if (ev.saved) log("🌅 سپیده دمید؛ دکتر " + nameOf(ev.saved) + " را نجات داد!");
        else log("🌅 سپیده دمید؛ شب آرامی بود.");
        break;
      case "chat":
        addChat(ev.name, ev.text);
        break;
      case "vote_update":
        picks = ev.votes || {};
        renderVotes();
        break;
      case "execution":
        if (ev.executed) log("⚖️ " + nameOf(ev.executed) + " با رأی شهر حذف شد" + (ev.role ? " (نقش: " + ev.role + ")" : "") + ".");
        else log("⚖️ رأی‌ها مساوی شد؛ کسی حذف نشد.");
        picks = {};
        VivaHalls.shake(hallGame);
        renderState(lastState, true);
        break;
      case "you_died":
        meDead = true;
        toast(ev.cause === "night" ? "شما شب گذشته حذف شدید — تماشاگر هستید" : "شما با رأی شهر حذف شدید — تماشاگر هستید");
        break;
      case "match_finished":
        showResult(ev);
        break;
      case "server_error":
        if (ev.msg === "rate_limited") toast("آهسته‌تر! تعداد پیام‌ها زیاد است.");
        break;
    }
  }

  function nameOf(accountId) {
    if (!lastState) return accountId;
    for (var i = 0; i < lastState.players.length; i++)
      if (lastState.players[i].account_id === accountId) return lastState.players[i].display_name;
    return accountId.slice(0, 6);
  }

  // --- رندر ---
  function seatPositions(n, idx) {
    var cx = 50, cy = 88, rx = 38, ry = 30;
    var ang = Math.PI * (0.06 + 0.88 * (n === 1 ? 0.5 : idx / (n - 1)));
    return { x: cx - rx * Math.cos(ang), y: cy - ry * Math.sin(ang) - 6 };
  }

  function renderSeats(st) {
    var wrap = $("seats");
    wrap.innerHTML = "";
    var players = st.match ? st.match.players : st.players;
    var votesFor = {};
    Object.keys(picks).forEach(function (voter) {
      var t = picks[voter]; votesFor[t] = (votesFor[t] || 0) + 1;
    });
    players.forEach(function (p, i) {
      var pos = seatPositions(players.length, i);
      var el = document.createElement("div");
      el.className = "seat" + (p.account_id === myId ? " me" : "") +
        ((st.match && st.match.game === "mafia") ? (p.alive ? "" : " dead") : "") +
        (targeting && targeting.targets.indexOf(p.account_id) >= 0 ? " targeting" : "");
      el.style.left = pos.x + "%"; el.style.top = pos.y + "%";
      var initial = (p.display_name || "?").trim().slice(0, 1);
      el.innerHTML = '<span class="ava">' + initial + "</span><b>" + p.display_name + "</b>" +
        '<i>' + (st.status === "lobby" ? (p.seat === 0 ? "میزبان" : "") : (p.alive ? "زنده" : "حذف")) + "</i>" +
        (p.account_id === st.host ? '<span class="crown">👑</span>' : "") +
        (votesFor[p.account_id] ? '<span class="votes">' + votesFor[p.account_id] + "</span>" : "");
      if (targeting && targeting.targets.indexOf(p.account_id) >= 0) {
        el.addEventListener("click", function () { pickTarget(p.account_id); });
      } else if (phaseName === "day_vote" && !meDead && p.alive && p.account_id !== myId) {
        el.addEventListener("click", function () { voteFor(p.account_id); });
      }
      wrap.appendChild(el);
    });
  }

  function pickTarget(targetId) {
    if (!Viva.action({ type: "night_pick", target: targetId })) toast("اتصال برقرار نیست");
  }
  function voteFor(targetId) {
    if (!Viva.action({ type: "vote", target: targetId })) toast("اتصال برقرار نیست");
    else toast("رأی شما روی " + nameOf(targetId) + " ثبت شد");
  }

  function renderTargets() {
    if (!targeting) return;
    var box = $("targets");
    box.classList.remove("hidden");
    box.innerHTML = "";
    var label = targeting.as === "mafia" ? "هدف مافیا" : targeting.as === "doctor" ? "نجات" : "بازرسی";
    var hint = document.createElement("div");
    hint.style.cssText = "width:100%;font-size:11px;color:#b3a67f;margin-bottom:2px";
    hint.textContent = "🎯 " + label + " — روی یک بازیکن بزن:";
    box.appendChild(hint);
    targeting.targets.forEach(function (id) {
      var b = document.createElement("button");
      b.className = "tbtn"; b.textContent = nameOf(id);
      b.addEventListener("click", function () { pickTarget(id); });
      box.appendChild(b);
    });
  }

  function renderVotes() {
    if (lastState) renderSeats(lastState);
  }

  var PHASE_TEXT = {
    night_pick: "شب است. نقش‌های فعال پنهانی انتخاب می‌کنند…",
    dawn: "سپیده می‌زند…",
    day_talk: "روز است — صحبت کنید و استدلال کنید.",
    day_vote: "رأی‌گیری! روی بازیکن موردنظر در میز بزنید."
  };
  function renderPhase() {
    var b = $("phase-badge");
    b.className = "phase-badge " + (phaseName === "day_talk" ? "day" : phaseName === "day_vote" ? "vote" : "");
    b.textContent = phaseName === "night_pick" ? "🌙 شب " + dayNo : phaseName === "day_talk" ? "☀️ روز " + dayNo : phaseName === "day_vote" ? "⚖️ رأی‌گیری" : "🌅 سپیده";
    $("phase-msg").textContent = PHASE_TEXT[phaseName] || "…";
  }

  function log(text) {
    var el = $("log");
    var p = document.createElement("div");
    p.innerHTML = text;
    el.appendChild(p);
    while (el.children.length > 14) el.removeChild(el.firstChild);
  }
  function addChat(name, text) {
    var c = $("chat");
    var p = document.createElement("p");
    p.innerHTML = "<b>" + escapeHtml(name) + ":</b> <span>" + escapeHtml(text) + "</span>";
    c.appendChild(p); c.scrollTop = c.scrollHeight;
    while (c.children.length > 60) c.removeChild(c.firstChild);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function renderState(st, keepLog) {
    if (!st) return;
    if (st.status === "lobby" || st.status === "closed") {
      $("match").classList.add("hidden");
      $("lobby").classList.remove("hidden");
      var mine = st.players.some(function (p) { return p.account_id === myId; });
      if (mine) {
        $("my-room").classList.remove("hidden");
        $("room-make").classList.add("hidden");
        $("my-room-info").textContent = "اتاق شما: " + st.players.length + "/" + st.capacity + " بازیکن — " +
          st.players.map(function (p) { return p.display_name; }).join("، ");
        $("start-btn").disabled = st.host !== myId || st.players.length < 5;
        $("start-btn").textContent = st.host !== myId ? "انتظار برای میزبان…" :
          st.players.length < 5 ? "حداقل ۵ بازیکن لازم است" : "آغاز مسابقه";
      } else {
        $("my-room").classList.add("hidden");
        $("room-make").classList.remove("hidden");
      }
      renderSeats(st);
    } else {
      $("lobby").classList.add("hidden");
      $("match").classList.remove("hidden");
      if (st.match) {
        phaseName = st.match.phase; phaseDeadline = st.match.deadline; dayNo = st.match.day;
        if (st.match.you) meDead = !st.match.you.alive;
        renderPhase();
      }
      renderSeats(st);
    }
  }

  function showResult(ev) {
    var r = ev.result || {};
    $("res-title").className = r.winner === "town" ? "town" : "mafia";
    $("res-title").textContent = r.winner === "town" ? "پیروزی شهر! 🏙️" : "پیروزی مافیا! 🩸";
    var roles = r.roles || {};
    var box = $("res-roles"); box.innerHTML = "";
    lastState && lastState.players.forEach(function (p) {
      var roleNames = { mafia: "مافیا", doctor: "دکتر", detective: "کارآگاه", citizen: "شهروند" };
      var d = document.createElement("div");
      d.innerHTML = "<span>" + escapeHtml(p.display_name) + "</span><b>" + (roleNames[roles[p.account_id]] || "—") +
        (r.winners && r.winners.indexOf(p.account_id) >= 0 ? " 🏆" : "") + "</b>";
      box.appendChild(d);
    });
    var rw = r.rewards || {};
    var mine = myId && rw[myId];
    $("res-rw").textContent = mine ? "پاداش شما: " + mine + " توکن VIVA" : "";
    $("result-overlay").classList.remove("hidden");
  }

  // --- لابی ---
  var caps = [5, 6, 7, 8, 9, 10, 11, 12], capSel = 7;
  var SPEEDS = [
    { label: "عادی", night: 30, talk: 90, vote: 45 },
    { label: "سریع", night: 12, talk: 35, vote: 20 },
    { label: "برق‌آسا", night: 4, talk: 8, vote: 8 }
  ], speedSel = 1;
  function renderSpeeds() {
    var box = $("speed-pills"); box.innerHTML = "";
    SPEEDS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "pill" + (i === speedSel ? " sel" : "");
      b.textContent = "⏱ " + s.label;
      b.addEventListener("click", function () { speedSel = i; renderSpeeds(); });
      box.appendChild(b);
    });
  }
  function renderCaps() {
    var box = $("cap-pills"); box.innerHTML = "";
    caps.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "pill" + (c === capSel ? " sel" : "");
      b.textContent = c + " نفر";
      b.addEventListener("click", function () { capSel = c; renderCaps(); });
      box.appendChild(b);
    });
  }
  function refreshRooms() {
    if (lastState && (lastState.status === "playing" || lastState.status === "finished")) return;
    Viva.rooms.list("mafia").then(function (d) {
      var box = $("rooms-list"); box.innerHTML = "";
      if (!d.rooms.length) { box.innerHTML = '<div class="room-card">هنوز اتاقی نیست — اولین اتاق را بساز!</div>'; return; }
      d.rooms.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "room-card";
        el.innerHTML = "<span>🚪 <b>" + r.host_name + "</b> · " + r.seated + "/" + r.capacity +
          (r.status === "playing" ? " · در جریان" : "") + "</span>";
        var btn = document.createElement("button");
        btn.className = "join"; btn.textContent = r.status === "lobby" ? "پیوستن" : "تماشا";
        btn.addEventListener("click", function () { joinRoom(r.room_id); });
        el.appendChild(btn); box.appendChild(el);
      });
    }).catch(function (e) {
      if (e.message === "VIVA_LOGIN_REQUIRES_BALE") toast("ورود واقعی فقط داخل مینی‌اپ بله انجام می‌شود.");
    });
  }

  var myRoomId = null;
  function joinRoom(id) {
    Viva.rooms.join(id).then(function (d) {
      myRoomId = id;
      return Viva.connectRoom(id);
    }).catch(function (e) { toast(e.message || "پیوستن ناموفق"); });
  }

  $("make-btn").addEventListener("click", function () {
    var s = SPEEDS[speedSel];
    Viva.rooms.create("mafia", capSel, { night_seconds: s.night, talk_seconds: s.talk, vote_seconds: s.vote })
      .then(function (d) { joinRoom(d.room.room_id); })
      .catch(function (e) { toast(e.message || "ساخت اتاق ناموفق"); });
  });
  $("start-btn").addEventListener("click", function () {
    if (!myRoomId) return;
    Viva.rooms.start(myRoomId).catch(function (e) { toast(e.message || "شروع ناموفق"); });
  });
  $("leave-btn").addEventListener("click", function () {
    if (!myRoomId) return;
    Viva.rooms.leave(myRoomId).then(function () {
      myRoomId = null; Viva.disconnect(); lastState = null;
      $("my-room").classList.add("hidden"); $("room-make").classList.remove("hidden");
      refreshRooms();
    });
  });
  $("res-back").addEventListener("click", function () {
    $("result-overlay").classList.add("hidden");
    location.reload();
  });
  $("chat-send").addEventListener("click", sendChat);
  $("chat-text").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });
  function sendChat() {
    var t = $("chat-text").value.trim();
    if (!t) return;
    Viva.action({ type: "chat", text: t });
    $("chat-text").value = "";
  }
  $("sound").addEventListener("click", toggleSound);

  // تایمر
  setInterval(function () {
    if (phaseDeadline) $("timer").textContent = fmtTime(phaseDeadline - now());
    else $("timer").textContent = "--";
  }, 500);

  // --- شروع ---
  Viva.ensureLogin().then(function () {
    myId = Viva.me() && Viva.me().id;
    myName = Viva.me() && Viva.me().display_name;
    // تخمین ساعت سرور از هدر Date
    return fetch("/health").then(function (res) {
      var d = res.headers.get("date");
      if (d) serverOffset = new Date(d).getTime() / 1000 - Date.now() / 1000;
    });
  }).then(function () {
    renderSpeeds(); renderCaps(); refreshRooms();
    setInterval(refreshRooms, 5000);
  }).catch(function (e) {
    toast(e.message === "VIVA_LOGIN_REQUIRES_BALE" ? "ورود واقعی فقط داخل مینی‌اپ بله انجام می‌شود." : "ورود ناموفق");
  });
})();
</script>
</body>
</html>
