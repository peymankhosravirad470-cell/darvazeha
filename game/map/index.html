<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<title>۷۷ سرزمین — نقشهٔ کل مناطق</title>
<link rel="icon" href="data:," />
<style>
@font-face { font-family: "Vazirmatn"; src: url("../gates/assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../gates/assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; background: #05060c; }
body { font-family: "Vazirmatn", ui-sans-serif, system-ui, sans-serif; color: #f2e8d5;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px calc(10px); background: linear-gradient(180deg, rgba(3,4,10,0.92) 0%, rgba(3,4,10,0.65) 75%, transparent 100%); }
.icon-btn { width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(217,169,60,0.35);
  background: rgba(10,12,22,0.6); color: #e8d9a8; font-size: 19px; cursor: pointer; display: grid; place-items: center;
  text-decoration: none; backdrop-filter: blur(6px); font-family: inherit; }
.tb-title { display: flex; flex-direction: column; }
.tb-title b { font-size: 16px; font-weight: 900; color: #ffe9a8; }
.tb-title span { font-size: 11px; color: #9a9178; }
.status-badge { margin-inline-start: auto; display: flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  background: rgba(8,10,18,0.65); border: 1px solid rgba(217,169,60,0.25); font-size: 11.5px; font-weight: 700; color: #9a9178; }
.status-badge .d { width: 8px; height: 8px; border-radius: 50%; background: #9a9178; animation: pulse 1.6s ease-in-out infinite; }
.status-badge.on { color: #9fe8b0; border-color: rgba(122,232,138,0.35); }
.status-badge.on .d { background: #7ae88a; box-shadow: 0 0 8px rgba(122,232,138,0.8); }
.status-badge.off { color: #ffb391; border-color: rgba(255,106,61,0.4); }
.status-badge.off .d { background: #ff6a3d; box-shadow: 0 0 8px rgba(255,106,61,0.8); }
@keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

#viewport { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#viewport.dragging { cursor: grabbing; }
#map-svg { width: 100%; height: 100%; display: block; }

.zoomctl { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 14px; z-index: 30;
  display: flex; flex-direction: column; gap: 8px; }
.zoomctl button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(217,169,60,0.35);
  background: rgba(10,12,22,0.7); color: #e8d9a8; font-size: 22px; cursor: pointer; backdrop-filter: blur(6px); font-family: inherit; }
.zoomctl button:active { background: rgba(217,169,60,0.25); }

.legend { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); right: 14px; z-index: 30;
  display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-radius: 14px;
  background: rgba(8,10,18,0.72); border: 1px solid rgba(217,169,60,0.25); backdrop-filter: blur(6px); font-size: 11.5px; color: #c8bd9a; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 6px; vertical-align: -1px; }

/* info sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; transform: translateY(105%);
  transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.25, 1); background: linear-gradient(180deg, #171a2c, #0b0d1a);
  border-top: 1px solid rgba(217,169,60,0.45); border-radius: 22px 22px 0 0; padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  box-shadow: 0 -18px 60px rgba(0,0,0,0.6); }
.sheet.on { transform: none; }
.sheet-grab { width: 44px; height: 4px; border-radius: 99px; background: rgba(217,169,60,0.35); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.sheet-realm { font-size: 15px; font-weight: 900; color: #ffe9a8; }
.sheet-realm small { color: #9a9178; font-weight: 700; letter-spacing: 2px; margin-inline-start: 8px; }
.sheet-close { margin-inline-start: auto; width: 36px; height: 36px; border-radius: 11px; border: 1px solid rgba(217,169,60,0.3);
  background: none; color: #b8a86a; font-size: 16px; cursor: pointer; font-family: inherit; }
.sheet-title { font-size: 21px; font-weight: 900; color: #f5e6bd; margin-top: 10px; }
.sheet-num { color: #b8a86a; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
.sheet-desc { color: #d8cba8; line-height: 2; font-size: 14px; margin-top: 8px; }
.state-chip { display: inline-block; margin-top: 10px; padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.state-chip.open { background: rgba(122,232,138,0.12); color: #9fe8b0; border: 1px solid rgba(122,232,138,0.4); }
.state-chip.locked { background: rgba(217,169,60,0.1); color: #b8a86a; border: 1px dashed rgba(217,169,60,0.4); }
.sheet-go { display: block; width: 100%; margin-top: 14px; text-align: center; text-decoration: none;
  border: 1.5px solid rgba(255,236,180,0.75); border-radius: 16px; padding: 14px; font-family: inherit; font-weight: 900;
  font-size: 16.5px; color: #241505; background: linear-gradient(180deg, #ffe9a8, #d9a93c 58%, #a8761f);
  box-shadow: 0 10px 30px rgba(217,169,60,0.35), inset 0 1.5px 0 rgba(255,255,255,0.6); }
.sheet-note { color: #6a6350; font-size: 11px; text-align: center; margin-top: 10px; }

.map-tip { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 25; color: #8f8468;
  font-size: 11px; background: rgba(8,10,18,0.55); border: 1px solid rgba(217,169,60,0.18); padding: 6px 14px;
  border-radius: 999px; pointer-events: none; transition: opacity 0.5s ease; }
</style>
</head>
<body>
<div class="topbar">
  <a class="icon-btn" href="/" aria-label="بازگشت به منوی اصلی">→</a>
  <div class="tb-title"><b>نقشهٔ کل مناطق</b><span>هفت امپراتوری · ۷۷ سرزمین رسمی</span></div>
  <div class="status-badge" id="status-badge"><span class="d"></span><span id="status-txt">در حال بررسی…</span></div>
</div>
<div class="map-tip" id="map-tip">با دو انگشت یا دکمه‌ها بزرگ‌نمایی کنید · روی هر سرزمین بزنید</div>
<div id="viewport"><svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="zoomctl">
  <button id="z-in" aria-label="بزرگ‌نمایی">＋</button>
  <button id="z-out" aria-label="کوچک‌نمایی">－</button>
  <button id="z-reset" aria-label="بازنشانی" style="font-size:15px">⌂</button>
</div>
<div class="legend">
  <span><i style="background:#7ae88a;box-shadow:0 0 6px rgba(122,232,138,.8)"></i> قلمرو آزاد</span>
  <span><i style="background:#3a3f63;border:1px dashed #6a6f8f"></i> قلمرو قفل</span>
  <span><i style="background:#ffe9a8;box-shadow:0 0 6px rgba(255,233,168,.9)"></i> موقعیت شما</span>
</div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <span class="sheet-dot" id="sh-dot"></span>
    <span class="sheet-realm" id="sh-realm"></span>
    <button class="sheet-close" id="sh-close" aria-label="بستن">✕</button>
  </div>
  <div class="sheet-title" id="sh-title"></div>
  <div class="sheet-num" id="sh-num"></div>
  <p class="sheet-desc" id="sh-desc"></p>
  <div id="sh-state"></div>
  <a class="sheet-go" id="sh-go" href="/game/gates/index.html">ورود از هفت دروازهٔ رسمی</a>
  <div class="sheet-note" id="sh-note"></div>
</div>
<script>
'use strict';
/* نقشهٔ کل مناطق — ۷ امپراتوری × ۱۱ سرزمین (دادهٔ رسمی: game/map/data.json)
   نام‌ها و هویت‌ها عیناً از دادهٔ رسمی خوانده می‌شود؛ چیزی اینجا ساخته نمی‌شود. */
var VB = { x: 0, y: 0, w: 780, h: 1920 };
var svg = document.getElementById('map-svg');
var SVGNS = 'http://www.w3.org/2000/svg';
var faDigits = '۰۱۲۳۴۵۶۷۸۹';
function faNum(n) { return String(n).replace(/\d/g, function (d) { return faDigits[+d]; }); }
function el(name, attrs, parent) {
  var e = document.createElementNS(SVGNS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
var lastPos = null;
try { lastPos = JSON.parse(localStorage.getItem('lands.lastLand') || 'null'); } catch (e) { lastPos = null; }

/* ---- layout: 7 regions in two columns (portrait-first), TARGON at the honored center ---- */
var RW = 340, RH = 430;
var LAYOUT = {
  dezhmaar: [40, 40], argad: [400, 40],
  mardak: [40, 510], targon: [400, 510],
  vergad: [40, 980], zardak: [400, 980],
  tarmad: [400, 1450],
};
var WORLD = { w: 780, h: 1920 };

function center(r) { var p = LAYOUT[r.id]; return [p[0] + RW / 2, p[1] + RH / 2]; }

function render(data) {
  svg.setAttribute('viewBox', VB.x + ' ' + VB.y + ' ' + VB.w + ' ' + VB.h);
  var defs = el('defs', {});
  var f = el('filter', { id: 'soft', x: '-40%', y: '-40%', width: '180%', height: '180%' }, defs);
  el('feGaussianBlur', { stdDeviation: 5, result: 'b' }, f);
  var mg = el('feMerge', {}, f);
  el('feMergeNode', { in: 'b' }, mg); el('feMergeNode', { in: 'SourceGraphic' }, mg);

  /* hub paths: the seven gates radiate from TARGON — مسیرهای ارتباطی */
  var t = center({ id: 'targon' });
  data.realms.forEach(function (r) {
    if (r.id === 'targon') return;
    var c = center(r);
    el('path', { d: 'M' + t[0] + ' ' + t[1] + ' Q' + ((t[0] + c[0]) / 2 + (c[1] < t[1] ? 60 : -60)) + ' ' + ((t[1] + c[1]) / 2) + ' ' + c[0] + ' ' + c[1],
      fill: 'none', stroke: '#d9a93c', 'stroke-opacity': '0.16', 'stroke-width': '2.5', 'stroke-dasharray': '3 9' });
  });

  data.realms.forEach(function (r) { renderRegion(r); });
  renderMysteryPlate();
}

/* راز مرکزی داستان — دروازهٔ هفتاد و هفتم (تزئینی، صادقانه: به‌زودی) */
function renderMysteryPlate() {
  var p = LAYOUT.tarmad;
  var g = el('g', { opacity: '0.8' });
  el('rect', { x: 40, y: p[1], width: RW, height: RH, rx: 26, fill: '#0d0f1a', 'fill-opacity': '0.6',
    stroke: '#d9a93c', 'stroke-opacity': '0.4', 'stroke-width': 1.6, 'stroke-dasharray': '8 8' }, g);
  var t1 = el('text', { x: 40 + RW / 2, y: p[1] + RH / 2 - 14, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 800,
    fill: '#b8a86a', 'font-family': 'Vazirmatn' }, g);
  t1.textContent = 'دروازهٔ هفتاد و هفتم';
  var t2 = el('text', { x: 40 + RW / 2, y: p[1] + RH / 2 + 18, 'text-anchor': 'middle', 'font-size': 12.5,
    fill: '#6a6350', 'font-family': 'Vazirmatn' }, g);
  t2.textContent = 'راز مرکزی جهان — در داستان گشوده می‌شود';
  var t3 = el('text', { x: 40 + RW / 2, y: p[1] + RH / 2 + 48, 'text-anchor': 'middle', 'font-size': 11.5,
    fill: '#55503e', 'font-family': 'Vazirmatn' }, g);
  t3.textContent = '؟';
}

function renderRegion(r) {
  var p = LAYOUT[r.id];
  var g = el('g', { 'data-realm': r.id });
  var open = !!r.unlocked;
  /* region plate */
  el('rect', { x: p[0], y: p[1], width: RW, height: RH, rx: 26,
    fill: r.color, 'fill-opacity': open ? '0.16' : '0.07',
    stroke: r.color, 'stroke-opacity': open ? '0.85' : '0.4',
    'stroke-width': open ? 2 : 1.6, 'stroke-dasharray': open ? '0' : '7 6' }, g);
  /* header */
  var ht = el('text', { x: p[0] + RW / 2, y: p[1] + 44, 'text-anchor': 'middle', 'font-size': 27, 'font-weight': 800,
    fill: '#f5e6bd', 'font-family': 'Vazirmatn' }, g);
  ht.textContent = r.fa;
  var he = el('text', { x: p[0] + RW / 2, y: p[1] + 66, 'text-anchor': 'middle', 'font-size': 11, 'letter-spacing': 5,
    fill: r.accent, 'font-weight': 700 }, g);
  he.textContent = r.en;
  var hm = el('text', { x: p[0] + RW / 2, y: p[1] + 88, 'text-anchor': 'middle', 'font-size': 11.5, fill: '#b8a86a', 'font-family': 'Vazirmatn' }, g);
  hm.textContent = '«' + r.motto + '»';
  if (!open) {
    var lk = el('text', { x: p[0] + RW / 2, y: p[1] + 116, 'text-anchor': 'middle', 'font-size': 11.5, 'font-weight': 700,
      fill: '#8f93ab', 'font-family': 'Vazirmatn' }, g);
    lk.textContent = '🔒 قفل امپراتوری — به‌زودی';
  }

  /* 11 land nodes — single official column, numbered ۱..۱۱ */
  var nx = p[0] + 48, y0 = p[1] + (open ? 146 : 160), step = (RH - (open ? 180 : 200)) / 10;
  var pts = [];
  for (var i = 0; i < r.lands.length; i++) {
    var y = y0 + i * step;
    pts.push([nx, y]);
  }
  /* route line */
  el('polyline', { points: pts.map(function (q) { return q.join(','); }).join(' '), fill: 'none',
    stroke: open ? r.accent : '#565a75', 'stroke-opacity': '0.4', 'stroke-width': 2, 'stroke-dasharray': open ? '0' : '4 5' }, g);
  r.lands.forEach(function (l, i) {
    var q = pts[i];
    var isMe = lastPos && lastPos.r === r.id && lastPos.l === l.id;
    var node = el('g', { 'data-realm': r.id, 'data-land': l.id, cursor: 'pointer' }, g);
    el('circle', { cx: q[0], cy: q[1], r: 16, fill: isMe ? '#ffe9a8' : '#0d0f1a',
      stroke: open ? r.accent : '#565a75', 'stroke-width': open ? 2.4 : 1.5,
      'stroke-dasharray': open ? '0' : '3 3', filter: open ? 'url(#soft)' : '' }, node);
    var num = el('text', { x: q[0], y: q[1] + 4.6, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 800,
      fill: open ? '#241505' : '#8f93ab', 'font-family': 'Vazirmatn' }, node);
    num.textContent = faNum(i + 1);
    var name = el('text', { x: q[0] + 25, y: q[1] + 4.8, 'font-size': 13.5, 'font-weight': open ? 700 : 400,
      fill: open ? '#efe4c3' : '#8f93ab', 'font-family': 'Vazirmatn' }, node);
    name.textContent = l.fa;
    if (isMe) {
      var ring = el('circle', { cx: q[0], cy: q[1], r: 16, fill: 'none', stroke: '#ffe9a8', 'stroke-width': 2 }, node);
      var anim = document.createElementNS(SVGNS, 'animate');
      anim.setAttribute('attributeName', 'r'); anim.setAttribute('values', '14;26;14');
      anim.setAttribute('dur', '2.2s'); anim.setAttribute('repeatCount', 'indefinite');
      ring.appendChild(anim);
      var me = el('text', { x: q[0] - 24, y: q[1] + 4.5, 'text-anchor': 'end', 'font-size': 11.5, 'font-weight': 800,
        fill: '#ffe9a8', 'font-family': 'Vazirmatn' }, node);
      me.textContent = 'موقعیت شما';
    }
    node.addEventListener('click', function () { showInfo(r, l, i); });
  });
  /* region header tap → realm info */
  var head = el('rect', { x: p[0] + 8, y: p[1] + 8, width: RW - 16, height: 104, rx: 18, fill: 'transparent', cursor: 'pointer' }, g);
  head.addEventListener('click', function () { showRealm(r); });
}

/* ---------------- info sheet ---------------- */
var sheet = document.getElementById('sheet');
function fillHead(r) {
  document.getElementById('sh-dot').style.background = r.color;
  document.getElementById('sh-dot').style.color = r.color;
  document.getElementById('sh-realm').innerHTML = r.fa + '<small>' + r.en + '</small>';
}
function showSheet() { sheet.classList.add('on'); }
document.getElementById('sh-close').addEventListener('click', function () { sheet.classList.remove('on'); });

function showInfo(r, l, idx) {
  fillHead(r);
  document.getElementById('sh-title').textContent = l.fa;
  document.getElementById('sh-num').textContent = 'سرزمین ' + faNum(idx + 1) + ' از ' + faNum(r.lands.length) + ' — قلمرو ' + r.fa;
  document.getElementById('sh-desc').textContent = l.desc;
  var st = document.getElementById('sh-state');
  if (r.unlocked) { st.innerHTML = '<span class="state-chip open">آزاد — قابل ورود</span>'; }
  else { st.innerHTML = '<span class="state-chip locked">قفل — در سطح امپراتوری بسته است</span>'; }
  var go = document.getElementById('sh-go');
  go.style.display = r.unlocked ? 'block' : 'none';
  document.getElementById('sh-note').textContent = r.unlocked
    ? 'ورود به این سرزمین از صفحهٔ هفت دروازهٔ رسمی انجام می‌شود.'
    : 'نام و هویت این سرزمین رسمی است؛ گشودن دروازه در نسخهٔ بعد انجام می‌شود.';
  showSheet();
}
function showRealm(r) {
  fillHead(r);
  document.getElementById('sh-title').textContent = 'قلمرو ' + r.fa;
  document.getElementById('sh-num').textContent = faNum(r.lands.length) + ' سرزمین رسمی';
  document.getElementById('sh-desc').textContent = r.lore;
  var st = document.getElementById('sh-state');
  st.innerHTML = r.unlocked
    ? '<span class="state-chip open">آزاد — تارگون و دژمار در نسخهٔ اول بازند</span>'
    : '<span class="state-chip locked">قفل — روی نقشهٔ جهان شناخته‌شده است</span>';
  document.getElementById('sh-go').style.display = r.unlocked ? 'block' : 'none';
  document.getElementById('sh-note').textContent = 'انتخاب قلمرو و ورود به سرزمین‌ها از صفحهٔ هفت دروازه انجام می‌شود.';
  showSheet();
}

/* ---------------- pan & zoom ---------------- */
var vp = document.getElementById('viewport');
function applyVB() { svg.setAttribute('viewBox', VB.x + ' ' + VB.y + ' ' + VB.w + ' ' + VB.h); }
function zoomAt(factor, cx, cy) {
  var nw = Math.min(2400, Math.max(360, VB.w * factor));
  var k = nw / VB.w;
  VB.x = cx - (cx - VB.x) * k; VB.y = cy - (cy - VB.y) * k;
  VB.w = nw; VB.h = VB.h * k; applyVB();
}
function clientToWorld(cx, cy) {
  var r = vp.getBoundingClientRect();
  return [VB.x + (cx - r.left) / r.width * VB.w, VB.y + (cy - r.top) / r.height * VB.h];
}
vp.addEventListener('wheel', function (e) {
  e.preventDefault();
  var w = clientToWorld(e.clientX, e.clientY);
  zoomAt(e.deltaY > 0 ? 1.12 : 0.89, w[0], w[1]);
}, { passive: false });
var pointers = new Map(), panLast = null, pinchD = 0, captured = false, downAt = null;
vp.addEventListener('pointerdown', function (e) {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) { panLast = [e.clientX, e.clientY]; downAt = [e.clientX, e.clientY]; }
  if (pointers.size === 2) {
    var a = Array.from(pointers.values());
    pinchD = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
  }
});
vp.addEventListener('pointermove', function (e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1 && panLast) {
    /* capture only after a real drag so plain taps still reach land nodes */
    if (!captured) {
      if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 8) return;
      captured = true; vp.setPointerCapture(e.pointerId); vp.classList.add('dragging');
    }
    var r = vp.getBoundingClientRect();
    VB.x -= (e.clientX - panLast[0]) / r.width * VB.w;
    VB.y -= (e.clientY - panLast[1]) / r.height * VB.h;
    applyVB(); panLast = [e.clientX, e.clientY];
  } else if (pointers.size === 2) {
    var a2 = Array.from(pointers.values());
    var d = Math.hypot(a2[0][0] - a2[1][0], a2[0][1] - a2[1][1]);
    if (pinchD > 0 && d > 0) {
      var mid = clientToWorld((a2[0][0] + a2[1][0]) / 2, (a2[0][1] + a2[1][1]) / 2);
      zoomAt(pinchD / d, mid[0], mid[1]);
    }
    pinchD = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { panLast = null; captured = false; vp.classList.remove('dragging'); }
}
vp.addEventListener('pointerup', endPointer); vp.addEventListener('pointercancel', endPointer);
document.getElementById('z-in').addEventListener('click', function () { var c = clientToWorld(innerWidth / 2, innerHeight / 2); zoomAt(0.8, c[0], c[1]); });
document.getElementById('z-out').addEventListener('click', function () { var c = clientToWorld(innerWidth / 2, innerHeight / 2); zoomAt(1.25, c[0], c[1]); });
document.getElementById('z-reset').addEventListener('click', function () { VB = { x: 0, y: 0, w: 780, h: 1920 }; applyVB(); });

/* ---------------- boot ---------------- */
var tip = document.getElementById('map-tip');
setTimeout(function () { tip.style.opacity = '0'; }, 5200);
fetch('data.json', { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('data ' + r.status); return r.json(); })
  .then(function (data) {
    window.__MAP77 = { realms: data.realms.length, lands: data.realms.reduce(function (n, r) { return n + r.lands.length; }, 0) };
    render(data);
  })
  .catch(function () {
    tip.textContent = 'بارگذاری دادهٔ رسمی نقشه ناموفق بود — دوباره تلاش کنید.';
  });
fetch('/health', { cache: 'no-store' })
  .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
  .then(function (h) {
    var ok = h && h.status === 'ok';
    var b = document.getElementById('status-badge');
    b.className = 'status-badge ' + (ok ? 'on' : 'off');
    document.getElementById('status-txt').textContent = ok ? 'سرور متصل' : 'سرور قطع';
  })
  .catch(function () {
    var b = document.getElementById('status-badge');
    b.className = 'status-badge off';
    document.getElementById('status-txt').textContent = 'سرور قطع';
  });
</script>
</body>
</html>
